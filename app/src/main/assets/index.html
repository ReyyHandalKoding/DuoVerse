<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuoVerse Chess</title><style>*{box-sizing:border-box}body{margin:0;background:#070912;color:#fff;font-family:system-ui}.wrap{max-width:760px;margin:auto;padding:14px}.panel{background:#101426;border:1px solid #ffffff14;border-radius:18px;padding:16px;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:12px;border-radius:10px;border:0}input{background:#080b16;color:#fff;border:1px solid #ffffff18;flex:1;min-width:120px}.p{background:#7c5cff;color:white;font-weight:800}.s{background:#ffffff12;color:white;font-weight:800}.muted{color:#9da3bd;font-size:13px}.hidden{display:none!important}#board{width:min(94vw,560px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:14px auto;border-radius:12px;overflow:hidden}.sq{border:0;border-radius:0;padding:0;font-size:clamp(28px,9vw,62px);line-height:1}.l{background:#d8d0b8}.d{background:#756b5c}.sel{box-shadow:inset 0 0 0 5px #9d8cff}.tar{box-shadow:inset 0 0 0 5px #72e6a8}.w{color:#fff;text-shadow:0 2px 2px #222}.b{color:#111;text-shadow:0 1px 1px #aaa}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}</style></head><body><div class="wrap"><div class="top"><h2>Duo<b>Verse</b> Chess</h2><span id="status">Connecting</span></div><section id="home" class="panel"><h3>Chess Multiplayer Test</h3><p class="muted">Kita tes satu engine dulu. Manusia memang menemukan cara paling efisien untuk membuat 15 bug sekaligus.</p><div class="row"><input id="nick" placeholder="Nickname" maxlength="18"><button class="p" onclick="saveNick()">Save</button></div><div class="row" style="margin-top:8px"><button class="p" onclick="createRoom()">Create Room</button><input id="code" maxlength="6" placeholder="Kode room"><button class="s" onclick="joinRoom()">Join</button></div><p id="msg" class="muted"></p></section><section id="room" class="panel hidden"><div class="top"><div><h3 id="title">Room</h3><div id="players" class="muted"></div></div><span id="rs">waiting</span></div><div id="pick"><p class="muted">Host tekan Start Chess.</p><button class="p" onclick="startChess()">Start Chess</button></div><div id="game" class="hidden"><div class="top"><b id="turn"></b><span id="who"></span></div><div id="board"></div><div class="muted">Moves</div><div id="moves" class="muted"></div></div><button class="s" onclick="home()" style="margin-top:10px">Back</button></section></div><script>
const URL='https://twzkqvvdtxixpkxwumys.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3emtxdnZkdHhpeHBreHd1bXlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5Mjg2OTIsImV4cCI6MjEwMzUwNDY5Mn0.W-uQHzkIE9pWuQQu4vqaCdqzH3EqqH3iRKW6PjscJlg',$=x=>document.getElementById(x);
let uid=null,rid=null,pnum=null,S=null,sel=null,token=null,poll=null;
async function req(path, opts={}){
  const headers={apikey:KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})};
  const r=await fetch(URL+path,{...opts,headers});
  let d=null; try{d=await r.json()}catch(_ ){}
  if(!r.ok) throw Error(d?.message||d?.msg||d?.error_description||d?.error||('HTTP '+r.status));
  return d;
}
function msg(x){$('msg').textContent=x}
function status(x){$('status').textContent=x}
function saveNick(){localStorage.dvnick=($('nick').value.trim()||'Player').slice(0,18);$('nick').value=localStorage.dvnick;msg('Nickname tersimpan.')}
async function auth(){
  const old=JSON.parse(localStorage.getItem('dv_session')||'null');
  if(old?.access_token){token=old.access_token;uid=old.user?.id||null;status('Online');return true}
  const r=await req('/auth/v1/signup',{method:'POST',body:'{}'});
  token=r.access_token;uid=r.user?.id;
  if(!token||!uid) throw Error('Supabase tidak mengembalikan session');
  localStorage.setItem('dv_session',JSON.stringify({access_token:token,user:r.user}));
  status('Online');return true;
}

async function createRoom(){try{await auth();let data=await req('/rest/v1/rpc/create_room',{method:'POST',body:JSON.stringify({p_game_id:'chess'})});let r=Array.isArray(data)?data[0]:data;if(!r?.id)throw Error('RPC tidak mengembalikan UUID');await open(r.id)}catch(e){msg('Create Room: '+e.message)}}
async function joinRoom(){try{await auth();let c=$('code').value.trim().toUpperCase();if(c.length!==6)return msg('Kode harus 6 karakter');let data=await req('/rest/v1/rpc/join_room',{method:'POST',body:JSON.stringify({p_code:c})});let r=Array.isArray(data)?data[0]:data;if(!r?.id)throw Error('RPC tidak mengembalikan UUID');await open(r.id)}catch(e){msg('Join Room: '+e.message)}}
async function open(id){rid=id;let rows=await req('/rest/v1/rooms?select=*&id=eq.'+encodeURIComponent(id)+'&limit=1');let r=rows?.[0];if(!r)throw Error('Room tidak ditemukan');$('home').classList.add('hidden');$('room').classList.remove('hidden');$('title').textContent='Room '+r.code;$('rs').textContent=r.status;await players();await refreshGame();startPoll()}
async function players(){let data=await req('/rest/v1/room_players?select=player_number,player_id,profiles(username)&room_id=eq.'+encodeURIComponent(rid)+'&order=player_number');$('players').innerHTML=(data||[]).map(x=>`P${x.player_number}: ${x.profiles?.username||'Player'}`).join(' · ');pnum=(data||[]).find(x=>x.player_id===uid)?.player_number||null}
async function refreshGame(){if(!rid)return;try{let rows=await req('/rest/v1/game_states?select=*&room_id=eq.'+encodeURIComponent(rid)+'&limit=1');let x=rows?.[0];if(x?.state)apply(x)}catch(e){msg('Sync: '+e.message)}}
function startPoll(){if(poll)clearInterval(poll);poll=setInterval(refreshGame,800)}
async function startChess(){try{let rows=await req('/rest/v1/rooms?select=host_id&id=eq.'+encodeURIComponent(rid)+'&limit=1');let r=rows?.[0];if(!r)throw Error('Room tidak ditemukan');if(r.host_id!==uid)return msg('Hanya host yang bisa start.');let s={board:init.map(x=>x.slice()),turn:1,moves:[],gameOver:false};let q=await req('/rest/v1/game_states?room_id=eq.'+encodeURIComponent(rid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({game_id:'chess',state:s,turn_player:1,version:1})});let z=await req('/rest/v1/rooms?id=eq.'+encodeURIComponent(rid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({game_id:'chess',status:'playing'})});apply({state:s,turn_player:1,version:1})}catch(e){msg('Start: '+e.message)}}
function ui(){$('pick').classList.add('hidden');$('game').classList.remove('hidden')}
function apply(x){S=typeof x.state==='string'?JSON.parse(x.state):x.state;if(!S)return;S.turn=x.turn_player||S.turn;S.version=x.version||0;ui();sel=null;render()}
function path(fr,fc,tr,tc){let dr=Math.sign(tr-fr),dc=Math.sign(tc-fc),r=fr+dr,c=fc+dc;while(r!==tr||c!==tc){if(S.board[r][c])return false;r+=dr;c+=dc}return true}function legal(fr,fc,tr,tc){let p=S.board[fr][fc],t=S.board[tr][tc];if(!p||!((p[0]==='w'&&pnum===1)||(p[0]==='b'&&pnum===2))||!((!t)||t[0]!==p[0]))return false;let dr=tr-fr,dc=tc-fc,a=Math.abs(dr),d=Math.abs(dc),k=p[1];if(k==='p'){let dir=p[0]==='w'?-1:1,start=p[0]==='w'?6:1;if(dc===0&&!t&&dr===dir)return true;if(dc===0&&!t&&!S.board[fr+dir][fc]&&fr===start&&dr===2*dir)return true;return d===1&&dr===dir&&!!t}if(k==='n')return a===2&&d===1||a===1&&d===2;if(k==='k')return Math.max(a,d)===1;if(k==='r')return(dr===0||dc===0)&&path(fr,fc,tr,tc);if(k==='b')return a===d&&path(fr,fc,tr,tc);if(k==='q')return(a===d||dr===0||dc===0)&&path(fr,fc,tr,tc);return false}
function click(r,c){if(!S||S.gameOver||S.turn!==pnum)return;let p=S.board[r][c];if(sel&&legal(sel[0],sel[1],r,c)){move(sel[0],sel[1],r,c);return}sel=p&&((p[0]==='w'&&pnum===1)||(p[0]==='b'&&pnum===2))?[r,c]:null;render()}async function move(fr,fc,tr,tc){let b=S.board.map(x=>x.slice()),p=b[fr][fc],cap=b[tr][tc];b[tr][tc]=p;b[fr][fc]='';if(p[1]==='p'&&(tr===0||tr===7))b[tr][tc]=p[0]+'q';let ns={board:b,turn:S.turn===1?2:1,moves:[...(S.moves||[]),String.fromCharCode(97+fc)+(8-fr)+'-'+String.fromCharCode(97+tc)+(cap?'x':'')],gameOver:!!(cap&&cap[1]==='k')};try{let rows=await req('/rest/v1/game_states?select=version&room_id=eq.'+encodeURIComponent(rid)+'&limit=1');let v=rows?.[0];if(!v)throw Error('Game state tidak ditemukan');let nv=(v.version||0)+1;await req('/rest/v1/game_states?room_id=eq.'+encodeURIComponent(rid)+'&version=eq.'+(v.version||0),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({state:ns,turn_player:ns.turn,version:nv})});apply({state:ns,turn_player:ns.turn,version:nv})}catch(e){msg('Move: '+e.message)}}
function render(){let b=$('board');b.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){let x=document.createElement('button'),p=S.board[r][c];x.className='sq '+((r+c)%2?'d':'l');if(sel?.[0]===r&&sel?.[1]===c)x.classList.add('sel');if(sel&&legal(sel[0],sel[1],r,c))x.classList.add('tar');if(p){x.textContent=g[p];x.classList.add(p[0]==='w'?'w':'b')}x.onclick=()=>click(r,c);b.appendChild(x)}$('turn').textContent=S.gameOver?'Game selesai':S.turn===pnum?'Giliran kamu':'Giliran Player '+S.turn;$('moves').textContent=S.moves?.join('  ')||'Belum ada langkah.'}
function home(){if(poll)clearInterval(poll);rid=null;S=null;$('room').classList.add('hidden');$('home').classList.remove('hidden')}$('nick').value=localStorage.dvnick||'Player';auth().catch(e=>{status('Offline');msg('Supabase: '+e.message)});
</script></body></html>
